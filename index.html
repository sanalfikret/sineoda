<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/plooy-wordmark.png" />
    <link rel="apple-touch-icon" href="/brand/plooy-wordmark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#080a12" />
    <meta name="description" content="Plooy — bağımsız sinema. Telefon, tablet ve Smart TV'de izle." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Plooy" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="tv-app" content="true" />
    <meta name="application-name" content="Plooy" />
    <meta name="google" content="notranslate" />
    <link rel="preload" href="/tv-banner.png" as="image" type="image/png" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Plooy</title>
    <style>
      @keyframes plooy-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root" data-plooy-boot="loading">
      <div
        style="min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#090a0e"
        aria-hidden="true"
      >
        <div
          style="width:40px;height:40px;border:2px solid #c9a962;border-top-color:transparent;border-radius:50%;animation:plooy-boot-spin 0.8s linear infinite"
        ></div>
      </div>
    </div>
    <script>
      ;(function () {
        var RECOVER_KEY = 'plooy-recover'

        function showBootError() {
          var root = document.getElementById('root')
          if (!root || root.getAttribute('data-plooy-boot') === 'ready') return
          root.setAttribute('data-plooy-boot', 'error')
          root.innerHTML =
            '<div style="min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:#090a0e;color:#e8eaef;font-family:system-ui,sans-serif;text-align:center">' +
            '<div><p style="font-size:18px;font-weight:600;margin:0 0 8px">Sayfa yüklenemedi</p>' +
            '<p style="margin:0 0 16px;color:#9aa3b5;font-size:14px">Eski önbellek kalmış olabilir. Ctrl+Shift+R ile yenileyin.</p>' +
            '<button type="button" onclick="location.reload()" style="cursor:pointer;border:0;border-radius:8px;padding:10px 18px;background:#c9a962;color:#090a0e;font-weight:700">Yeniden dene</button></div></div>'
        }

        function recoverCaches(done) {
          var finish = typeof done === 'function' ? done : function () {}
          var tasks = []
          if ('serviceWorker' in navigator) {
            tasks.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (reg) { return reg.unregister() }))
              }),
            )
          }
          if (window.caches) {
            tasks.push(
              caches.keys().then(function (names) {
                return Promise.all(names.map(function (name) { return caches.delete(name) }))
              }),
            )
          }
          if (!tasks.length) {
            finish()
            return
          }
          Promise.all(tasks).then(finish).catch(finish)
        }

        window.addEventListener(
          'error',
          function (event) {
            var target = event.target
            if (!target || target.tagName !== 'SCRIPT') return
            var root = document.getElementById('root')
            if (!root || root.getAttribute('data-plooy-boot') === 'ready') return
            if (!sessionStorage.getItem(RECOVER_KEY)) {
              sessionStorage.setItem(RECOVER_KEY, '1')
              recoverCaches(function () {
                location.reload()
              })
              return
            }
            sessionStorage.removeItem(RECOVER_KEY)
            showBootError()
          },
          true,
        )
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
