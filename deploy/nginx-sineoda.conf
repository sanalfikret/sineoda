# VPS: /etc/nginx/sites-enabled/sineoda
# SSL: certbot --nginx -d birtakimislerdizi.com -d www.birtakimislerdizi.com
#
# proxy_pass yalnizca location / { ... } icinde olmali.
# location disinda birakilirsa nginx baslamaz (502 / connection refused).

server {
    listen 80;
    server_name birtakimislerdizi.com www.birtakimislerdizi.com;

    client_max_body_size 100M;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
