services:
  - type: web
    name: sineoda-api
    runtime: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: REQUIRE_SUBSCRIPTION
        value: "false"
      - key: REQUIRE_SMS_VERIFICATION
        value: "false"
